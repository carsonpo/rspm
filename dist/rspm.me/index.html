:root {

  --text-3: #6f716a;

  --accent-hover: #0a5949;
  --accent-soft: #e2f0eb;
  --accent-text: #0b5c4c;
  --on-accent: #ffffff;
  --danger: #b3261e;
  --danger-soft: #fbe9e7;
  --warn: #7a5100;
  --warn-soft: #fbf1db;
  --ring: color-mix(in oklab, var(--accent) 40%, transparent);
  --scrim: rgb(20 22 20 / 0.35);

  --shadow-sm: 0 1px 2px rgb(20 22 20 / 0.05);
  --shadow: 0 1px 2px rgb(20 22 20 / 0.04), 0 6px 24px rgb(20 22 20 / 0.07);
  --shadow-lg: 0 2px 6px rgb(20 22 20 / 0.06), 0 24px 64px rgb(20 22 20 / 0.16);

  --r-xs: 5px;
  --r-sm: 8px;
  --r: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s7: 32px;
  --s8: 48px;

  --t-xs: 0.75rem;
  --t-sm: 0.8125rem;
  --t: 0.9375rem;
  --t-md: 1rem;
  --t-lg: 1.125rem;
  --t-xl: 1.375rem;
  --t-2xl: 1.75rem;

  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --fast: 120ms;
  --med: 200ms;

  --sidebar: 236px;
  --list: 340px;
}

@media (prefers-color-scheme: dark) {

    --bg: #121413;
    --surface: #181b19;
    --surface-2: #1f2321;
    --surface-3: #272b29;
    --border: #2a2e2c;
    --border-strong: #3a3f3c;
    --text: #ecedea;
    --text-2: #b2b5af;
    --text-3: #8f938d;
    --accent: #4fc4a8;

/* ── Forms ────────────────────────────────────────────────────────────────── */

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px;

}

.toggle-label { font-weight: 540; }
.toggle-hint { font-size: var(--t-sm); color: var(--text-2); }

.segmented-option { flex: 1; height: 32px; padding: 0 var(--s3); border: 0; border-radius: 6px; background: transparent; color: var(--text-2); font-size: var(--t-sm); font-weight: 560; white-space: nowrap; transition: background var(--fast) var(--ease), color var(--fast) var(--ease); }

.range { display: flex; flex-direction: column; gap: 6px; font-size: var(--t-sm); color: var(--text-2); }

/* ── Notices, progress, empty states ─────────────────────────────────────── */

.notice { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r); font-size: var(--t-sm); line-height: 1.5; }
.notice .icon { margin-top: 1px; }
.notice-body { display: flex; flex-direction: column; gap: 2px; }
.notice-body strong { font-weight: 600; }
.notice-info { background: var(--accent-soft); color: var(--accent-text); }
.notice-info .notice-body > div { color: var(--text-2); }
.notice-warn { background: var(--warn-soft); color: var(--warn); }
.notice-warn .notice-body > div { color: var(--text-2); }

.progress-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width var(--med) var(--ease); }

.empty-icon { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: var(--s2); border-radius: var(--r-lg); background: var(--surface-2); color: var(--text-3); }
.empty-title { font-size: var(--t-md); }
.empty-body { color: var(--text-2); font-size: var(--t-sm); margin-bottom: var(--s3); }

.loading { display: flex; align-items: center; gap: var(--s3); color: var(--text-2); padding: var(--s6) 0; }

/* ── Brand ───────────────────────────────────────────────────────────────── */

.brand { display: flex; align-items: center; gap: var(--s2); }
.brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent); flex: none; }
.brand-name { font-weight: 700; font-size: var(--t-lg); letter-spacing: -0.02em; }
.brand-tag { color: var(--text-3); font-size: var(--t-sm); margin-left: var(--s1); }

/* ── Auth ────────────────────────────────────────────────────────────────── */

.auth { min-height: 100dvh; display: grid; place-items: center; padding: var(--s7) var(--s4); }
.auth-card {
  width: 100%; max-width: 440px;
  display: flex; flex-direction: column; gap: var(--s5);
  padding: var(--s7); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow);

.auth-card-wide { max-width: 560px; }
.auth-title { font-size: var(--t-2xl); }

  padding: var(--s3) var(--s4); border-radius: var(--r); background: var(--surface-2);
  font-size: var(--t-sm); color: var(--text-2);
}

.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }

.step-dot { display: none; }

.principles li { display: flex; gap: var(--s3); }
.principles p { color: var(--text-2); font-size: var(--t-sm); margin-top: 2px; }
.principle-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent-text); flex: none; }

.account-key {
  padding: var(--s5) var(--s4); border-radius: var(--r); text-align: center;
  background: var(--surface-2); border: 1px dashed var(--border-strong);
  font-size: 1.05rem; font-weight: 560; letter-spacing: 0.06em; word-spacing: 0.1em; line-height: 1.8;
  user-select: all; overflow-wrap: anywhere;
}

.toggle-indent { padding-left: 48px; }
.passkey-hero { display: flex; gap: var(--s4); align-items: flex-start; }
.passkey-icon { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: var(--r); background: var(--accent-soft); color: var(--accent-text); }
.status-ok { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-text); font-weight: 520; }

/* ── Shell ───────────────────────────────────────────────────────────────── */

.shell { display: grid; grid-template-columns: var(--sidebar) var(--list) minmax(0, 1fr); height: 100dvh; }

.sidebar-brand { display: flex; align-items: center; gap: var(--s2); padding: var(--s1) var(--s2) var(--s2); }
.sidebar-brand .brand-mark { width: 26px; height: 26px; border-radius: 7px; }
.new-wrap { position: relative; padding: 0 var(--s1); }

.menu {
  position: absolute; z-index: 20; top: calc(100% + 6px); left: var(--s1); right: var(--s1);
  display: flex; flex-direction: column; padding: var(--s1);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-lg);
  animation: pop var(--med) var(--ease);
}
.menu-item { display: flex; align-items: center; gap: var(--s3); height: 36px; padding: 0 var(--s3); border: 0; border-radius: 6px; background: none; text-align: left; font-weight: 500; }

.menu-item .icon { color: var(--text-2); }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-secondary { margin-top: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--border); }
.nav-item {
  display: flex; align-items: center; gap: var(--s3); width: 100%; height: 36px; padding: 0 var(--s3);
  border: 0; border-radius: var(--r-sm); background: none; color: var(--text-2); font-weight: 520; text-align: left;
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.is-active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--border); }
.nav-item.is-active .icon { color: var(--accent-text); }
.nav-item > span:first-of-type { flex: 1; }

.sync { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* List pane */
.list-pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--surface); }
.list-head { padding: var(--s4) var(--s4) var(--s3); display: flex; flex-direction: column; gap: var(--s3); }
.search { display: flex; align-items: center; gap: var(--s2); height: 38px; padding: 0 var(--s3); background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-sm); color: var(--text-3); transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease), background var(--fast) var(--ease); }

.search-input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--text); }
.search-input::placeholder { color: var(--text-3); }
.search-input::-webkit-search-cancel-button { display: none; }
.search-kbd { font-size: var(--t-xs); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border-strong); color: var(--text-3); }

.item-list { flex: 1; overflow-y: auto; padding: 0 var(--s2) var(--s4); overscroll-behavior: contain; }
.item-row {
  display: flex; align-items: center; gap: var(--s3); width: 100%; padding: 10px var(--s3);
  border: 0; border-radius: var(--r); background: none; text-align: left;
  transition: background var(--fast) var(--ease);
}
.item-row:hover { background: var(--surface-2); }
.item-row.is-selected { background: var(--accent-soft); }
.item-row:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.item-row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item-row-name { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-row-sub { font-size: var(--t-sm); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 1.2em; }
.list-empty { padding: var(--s6) var(--s4); text-align: center; font-size: var(--t-sm); }
.list-empty-wrap { flex: 1; display: grid; place-items: center; padding: var(--s6); }

.monogram {
  display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 10px;
  font-weight: 650; font-size: 0.95rem; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border);
}
.item-row.is-selected .monogram { background: var(--surface); }
.monogram-totp { border-radius: 50%; }
.monogram-env { font-family: var(--mono); border-radius: 8px; }
.monogram-note { border-style: dashed; }

/* Detail pane */
.detail-pane { min-height: 0; overflow-y: auto; background: var(--bg); }
.detail, .page { max-width: 720px; margin: 0 auto; padding: var(--s7) var(--s7) var(--s8); display: flex; flex-direction: column; gap: var(--s6); }
.detail-empty { height: 100%; display: grid; place-items: center; padding: var(--s6); }
.detail-header { display: flex; align-items: center; gap: var(--s4); }
.detail-header .monogram { width: 52px; height: 52px; border-radius: 14px; font-size: 1.3rem; background: var(--surface); }
.detail-header .monogram-totp { border-radius: 50%; }
.detail-heading { flex: 1; min-width: 0; }
.detail-title { font-size: var(--t-xl); overflow-wrap: anywhere; }
.detail-kind { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: var(--t-sm); margin-top: 2px; }
.detail-actions { display: flex; gap: 2px; }
.detail-meta { padding-top: var(--s2); }

.value-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.value-list > .muted { padding: var(--s4); }
.value-row { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s3) var(--s3) var(--s4); min-height: 64px; }
.value-row + .value-row { border-top: 1px solid var(--border); }
.value-row-main { flex: 1; min-width: 0; }
.value-row-label { font-size: var(--t-xs); font-weight: 600; letter-spacing: 0.02em; color: var(--text-3); margin-bottom: 2px; }
.value-row-value { overflow-wrap: anywhere; }
.value-row-value.mono { font-size: 0.9rem; letter-spacing: 0.015em; }
.value-row-value.multiline { white-space: pre-wrap; }
.value-row-actions { display: flex; gap: 2px; align-self: center; }
.value-row-block { flex-direction: column; align-items: stretch; gap: var(--s1); }

.panel { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s5); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.panel-title { font-size: var(--t-md); }
.code-line { display: flex; align-items: center; gap: var(--s2); padding: var(--s1) var(--s1) var(--s1) var(--s3); background: var(--surface-2); border-radius: var(--r-sm); }
.code-line code { flex: 1; background: none; padding: 6px 0; overflow-x: auto; white-space: nowrap; }
.code-line code.break { white-space: normal; }

/* TOTP */
.totp-main { display: flex; align-items: center; gap: var(--s3); }
.totp-code {
  border: 0; background: none; padding: 0; color: var(--text);
  font: 600 1.85rem/1.2 var(--mono); letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
  transition: color var(--med) var(--ease);
}
.totp-code.is-low { color: var(--danger); }
.totp-meta { display: flex; align-items: center; gap: 6px; margin-left: auto; color: var(--text-3); font-size: var(--t-sm); font-variant-numeric: tabular-nums; min-width: 52px; }
.totp-ring { display: block; }
.totp-ring-track { fill: none; stroke: var(--surface-3); stroke-width: 2.5; }
.totp-ring-fill { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke var(--med) var(--ease); }
.totp-ring-fill.is-low { stroke: var(--danger); }
.totp-compact { display: inline-flex; align-items: center; gap: 6px; font: 560 var(--t-sm)/1 var(--mono); color: var(--text-2); font-variant-numeric: tabular-nums; }

/* Editor */
.editor { display: flex; flex-direction: column; gap: var(--s5); }
.editor-footer { display: flex; justify-content: flex-end; gap: var(--s2); padding-top: var(--s2); }
.generator { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4); margin-top: var(--s2); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); animation: pop var(--med) var(--ease); }
.generator-top { display: flex; align-items: center; gap: var(--s3); }
.generator-top .segmented { flex: 1; max-width: 280px; }
.generator-bits { margin-left: auto; font-size: var(--t-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
.generator-value { padding: var(--s3); border-radius: var(--r-sm); background: var(--surface-2); font-size: 0.95rem; overflow-wrap: anywhere; min-height: 46px; }
.generator-opts { display: flex; flex-direction: column; gap: var(--s3); }
.env-rows { display: flex; flex-direction: column; gap: var(--s2); }
.env-row { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr) auto; gap: var(--s2); align-items: center; }
.env-row .input-group .input { padding-right: 40px; }
.paste-env { display: flex; flex-direction: column; gap: var(--s2); }

/* Pages */
.page-header { display: flex; align-items: center; gap: var(--s3); }
.page-title { font-size: var(--t-xl); }
.page-subtitle { color: var(--text-2); font-size: var(--t-sm); margin-top: 2px; }
.settings-section { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--border); }
.settings-section-head h2 { font-size: var(--t-md); margin-bottom: 4px; }
.settings-section-body { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); min-height: 40px; }
.settings-row-label { font-weight: 560; }
.settings-row-value { font-size: var(--t-sm); color: var(--text-2); overflow-wrap: anywhere; }
.settings-row .select { width: auto; }
.settings-footer { display: flex; justify-content: flex-end; padding-top: var(--s5); border-top: 1px solid var(--border); }

.fingerprint-box { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s4); background: var(--surface-2); border-radius: var(--r); }
.fingerprint-label { font-size: var(--t-xs); font-weight: 600; color: var(--text-3); letter-spacing: 0.02em; }
.fingerprint { font-size: 1.05rem; font-weight: 560; letter-spacing: 0.08em; word-spacing: 0.2em; }

.share-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.share-row { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); }
.share-row + .share-row { border-top: 1px solid var(--border); }
.share-row-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-2); }
.share-row-main { flex: 1; min-width: 0; }
.share-row-name { font-weight: 560; }
.share-result { display: flex; gap: var(--s3); align-items: flex-start; }
.share-result-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); flex: none; }

/* ── Dialog ──────────────────────────────────────────────────────────────── */

.dialog {
  width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0;
  border: 1px solid var(--border); border-radius: var(--r-xl);
  background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg);
  overflow: auto;
}
.dialog-wide { width: min(680px, calc(100vw - 32px)); }
.dialog[open] { animation: dialog-in var(--med) var(--ease); }
.dialog::backdrop { background: var(--scrim); backdrop-filter: blur(2px); animation: fade var(--med) var(--ease); }
@keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
@keyframes fade { from { opacity: 0; } }
.dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); padding: var(--s5) var(--s5) 0 var(--s6); }
.dialog-title { font-size: var(--t-lg); padding-top: 4px; }
.dialog-subtitle { color: var(--text-2); font-size: var(--t-sm); margin-top: 2px; }
.dialog-body { padding: var(--s5) var(--s6); }
.dialog-footer { display: flex; justify-content: flex-end; gap: var(--s2); padding: var(--s4) var(--s6) var(--s5); border-top: 1px solid var(--border); background: var(--bg); }
.dialog-body .dialog-footer { margin: var(--s2) calc(-1 * var(--s6)) calc(-1 * var(--s5)); }

/* ── Toasts & banner ─────────────────────────────────────────────────────── */

.toasts { position: fixed; z-index: 100; left: 50%; bottom: max(var(--s5), env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: var(--s2); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: var(--s2); padding: 10px var(--s4);
  border-radius: 999px; background: var(--text); color: var(--bg);
  font-size: var(--t-sm); font-weight: 520; box-shadow: var(--shadow-lg);
  animation: toast-in var(--med) var(--ease);
}
.toast-danger { background: var(--danger); color: #fff; }
.toast .icon { opacity: 0.85; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

.update-banner {
  position: fixed; z-index: 90; right: var(--s5); bottom: var(--s5); max-width: 460px;
  display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s3) var(--s3) var(--s4);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
}
.update-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }

/* ── Responsive ──────────────────────────────────────────────────────────── */

.only-mobile { display: none; }

@media (max-width: 1100px) {
  :root { --sidebar: 72px; --list: 300px; }
  .sidebar { padding: var(--s4) var(--s2); align-items: center; }
  .sidebar-brand .brand-name, .nav-item > span, .sync { display: none; }
  .new-wrap > .btn { width: 44px; padding: 0; }
  .new-wrap > .btn > span { display: none; }
  .menu { left: 0; right: auto; width: 220px; }
  .nav-item { justify-content: center; padding: 0; width: 44px; }
  .sidebar-foot { padding: var(--s2) 0 0; justify-content: center; }
  .settings-section { grid-template-columns: 1fr; gap: var(--s3); }
}

@media (max-width: 720px) {
  .shell { display: block; height: auto; min-height: 100dvh; }
  .sidebar { display: none; }
  .list-pane { min-height: 100dvh; border-right: 0; }
  .shell[data-pane="detail"] .list-pane { display: none; }
  .shell[data-pane="list"] .detail-pane { display: none; }
  .detail-pane { min-height: 100dvh; }
  .only-mobile { display: contents; }
  .mobile-bar { display: flex; align-items: center; gap: var(--s2); }
  .mobile-filter { flex: 1; min-width: 0; height: 36px; border: 0; background: none; font-size: var(--t-lg); font-weight: 650; padding: 0 var(--s1); }
  .detail, .page { padding: var(--s4) var(--s4) var(--s8); gap: var(--s5); }
  .detail-header { gap: var(--s3); }
  .detail-header .monogram { width: 44px; height: 44px; }
  .auth { padding: var(--s4); place-items: start center; }
  .auth-card { padding: var(--s6) var(--s5); border-radius: var(--r-lg); }
  .auth-title { font-size: var(--t-xl); }
  .brand-tag { display: none; }
  .grid-2 { grid-template-columns: 1fr; }
  .env-row { grid-template-columns: 1fr auto; }
  .env-row > .input-group { grid-column: 1; }
  .update-banner { left: var(--s3); right: var(--s3); bottom: var(--s3); flex-wrap: wrap; }
  .toasts { width: calc(100% - 32px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* ── Print: Emergency Kit only ───────────────────────────────────────────── */

.print-kit { display: none; }
@media print {
  body > *:not(.print-kit) { display: none !important; }
  body { background: #fff; color: #000; }
  .print-kit { display: block; max-width: 640px; margin: 40px auto; font: 12pt/1.5 var(--font); }
  .print-kit h1 { font-size: 22pt; margin-bottom: 12pt; }
  .print-kit dl { display: grid; grid-template-columns: 140px 1fr; gap: 14pt 16pt; margin: 24pt 0; padding: 18pt; border: 1.5pt solid #000; border-radius: 8pt; }
  .print-kit dt { font-weight: 700; }
  .print-kit dd { margin: 0; }
  .print-kit .key { font: 600 14pt/1.6 var(--mono); letter-spacing: 0.05em; }
  .print-kit .blank { color: #555; }
}
